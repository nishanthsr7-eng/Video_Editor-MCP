[project]
name = "character-extractor-mcp"
version = "0.1.0"
description = "使用 anime-segmentation (ISNet) 模型将动漫角色从背景中分离"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.6.0",
    "onnxruntime>=1.17.0,<1.20",
    "numpy>=1.24.0",
    "pillow>=10.0.0"
]

[tool.poetry]
packages = [
    {include = "character_extractor_mcp", from = "src"},
]

[project.scripts]
character-extractor-mcp = "character_extractor_mcp.server:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
